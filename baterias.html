    <style>
        /* Estilo geral da página */
        body {
            background-color: rgb(39, 36, 36);
            margin: 0;
            padding: 20px;
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }

        /* Estilo do banner topo */
        .banner-topo {
            width: 100%;
            max-width: 1335px;
            height: auto;
            display: block;
            margin: 0 auto 30px auto;
        }

        /* Container da vitrine (permite colocar vários produtos lado a lado) */
        .vitrine {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        /* Card do Produto */
        .card-produto {
            background-color: #17385c;
            border-radius: 14px;
            padding: 15px;
            width: 240px;
            box-shadow: 0 10px 15px rgba(53, 116, 233, 0.25);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card-produto:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0, 153, 255, 0.4);
        }

        /* Área do Carrossel de Imagens */
        .carrossel {
            position: relative;
            width: 100%;
            height: 200px;
            overflow: hidden;
            border-radius: 10px;
            background-color: #121212;
        }

        .carrossel img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none; /* Esconde todas por padrão */
        }

        .carrossel img.ativa {
            display: block; /* Mostra apenas a foto atual */
        }

        /* Setas de navegação */
        .seta {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.65);
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .seta:hover {
            background-color: rgb(0, 153, 255);
        }

        .seta.esq { left: 8px; }
        .seta.dir { right: 8px; }

        /* Link do Nome do Modelo */
        .nome-modelo {
            display: block;
            margin-top: 12px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            text-decoration: none;
            transition: color 0.2s;
        }

        .nome-modelo:hover {
            color: rgb(0, 153, 255);
        }

        /* Estrelas de Nível */
        .estrelas {
            margin-top: 8px;
            font-size: 18px;
            color: #ffc107; /* Cor dourada */
            letter-spacing: 2px;
        }

        .estrelas .vazia {
            color: #555555; /* Cor da estrela apagada */
        }
    </style>
</head>

    <script>
        // Função para passar as fotos para o lado
        function mudarFoto(botao, direcao) {
            const carrossel = botao.parentElement;
            const imagens = carrossel.querySelectorAll('img');
            let indexAtual = 0;

            imagens.forEach((img, index) => {
                if (img.classList.contains('ativa')) {
                    indexAtual = index;
                    img.classList.remove('ativa');
                }
            });

            let novoIndex = indexAtual + direcao;
            if (novoIndex >= imagens.length) novoIndex = 0;
            if (novoIndex < 0) novoIndex = imagens.length - 1;

            imagens[novoIndex].classList.add('ativa');
        }

        // Função que desenha as estrelas automaticamente
        document.querySelectorAll('.estrelas').forEach(container => {
            const nota = parseInt(container.getAttribute('data-estrelas'));
            const totalEstrelas = 5;
            let htmlEstrelas = '';

            for (let i = 1; i <= totalEstrelas; i++) {
                if (i <= nota) {
                    htmlEstrelas += '★'; // Estrela preenchida
                } else {
                    htmlEstrelas += '<span class="vazia">★</span>'; // Estrela vazia
                }
            }
            container.innerHTML = htmlEstrelas;
        });
    </script>
