        }
        

        /* Botão com imagem */
        .btn-imagem {
            display: inline-block;
            border-radius: 12px;
            box-shadow: 0 10px 10px rgba(53, 116, 233, 0.25);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
            max-width: 1335px;
            width: 100%;
        }

        .btn-imagem img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 12px;
        }

        /* Efeito ao passar o mouse por cima */
        .btn-imagem:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(212, 212, 212, 0.35);
        }

        /* Efeito de clique */
        .btn-imagem:active {
            transform: translateY(1px);
            box-shadow: 0 2px 5px rgb(0, 153, 255);
        }
